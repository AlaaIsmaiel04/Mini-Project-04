services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartshelf
      POSTGRES_USER: smartshelf
      POSTGRES_PASSWORD: smartshelf_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - smartshelf_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartshelf -d smartshelf"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  smartshelf_data:
